[browser]
# Do not send usage statistics to Streamlit: inquiry data stays on this computer.
gatherUsageStats = false

[client]
# Hide the developer menu and the "Deploy" button for sales users.
toolbarMode = "viewer"

[server]
# Uploaded files are small; refuse anything unusually large.
maxUploadSize = 50

[theme]
base = "light"
primaryColor = "#16324F"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14202E"
font = "sans-serif"
